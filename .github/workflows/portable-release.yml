name: Muakmuak portable para Windows
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build-windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Dependencias
        run: npm ci
      - name: Compilar ejecutable portable
        shell: pwsh
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
          MUAK_GITHUB_REPO: ${{ github.repository }}
        run: npm run tauri build -- --no-bundle
      - name: Crear ZIP portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path portable -Force | Out-Null
          Copy-Item src-tauri/target/release/muakmuak.exe portable/muakmuak.exe
          Copy-Item PORTABLE_LEEME.txt portable/LEEME.txt
          Compress-Archive -Path portable/* -DestinationPath Muakmuak-portable-win-x64.zip -Force
      - uses: softprops/action-gh-release@v2
        with:
          files: Muakmuak-portable-win-x64.zip
          generate_release_notes: true
